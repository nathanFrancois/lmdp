server:
  address: ${SERVER_ADDRESS}
  port: ${PORT}
  error:
    include-message: never

spring:
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  thymeleaf:
    cache: ${THYMELEAF_CACHE}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

shop:
  base-url: ${SHOP_BASE_URL:https://lmdp.net}
  shipping-fee: ${SHOP_SHIPPING_FEE:6.90}
  contact-email: ${SHOP_CONTACT_EMAIL}

cawl:
  pspid: ${CAWL_PSPID:lmdp}
  api-key: ${CAWL_API_KEY}
  api-secret: ${CAWL_API_SECRET}
  webhook-key: ${CAWL_WEBHOOK_KEY}
  webhook-secret: ${CAWL_WEBHOOK_SECRET}
  api-endpoint: ${CAWL_API_ENDPOINT}
  integrator: ${CAWL_INTEGRATOR:lmdp}

  admin:
    username: ${CAWL_ADMIN_USERNAME:admin}
    password: ${CAWL_ADMIN_PASSWORD}

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME:Les Merveilles de Philomène}
