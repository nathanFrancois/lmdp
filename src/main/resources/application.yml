server:
  address: 127.0.0.1
  port: 8077
  error:
    include-message: never

spring:
  thymeleaf:
    cache: false

  datasource:
    url: "jdbc:h2:file:./data/cawl;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

cawl:
  pspid: ${CAWL_PSPID}
  api-key: ${CAWL_API_KEY}
  api-secret: ${CAWL_API_SECRET}
  webhook-key: ${CAWL_WEBHOOK_KEY}
  webhook-secret: ${CAWL_WEBHOOK_SECRET}
  return-url: ${CAWL_RETURN_URL:http://localhost:8080/payment-return}

  # Compte administrateur du back-office (/admin), créé automatiquement au premier
  # démarrage si la table admin_users est vide. Si le mot de passe n'est pas fourni,
  # un mot de passe aléatoire est généré et affiché une seule fois dans les logs.
  admin:
    username: ${CAWL_ADMIN_USERNAME:admin}
    password: ${CAWL_ADMIN_PASSWORD:}

  # Dossier (hors classpath) où sont stockées les photos de produits envoyées
  # depuis le back-office, servies ensuite sous /uploads/**.
  uploads-dir: ${CAWL_UPLOADS_DIR:./data/uploads/products}


