server:
  address: 127.0.0.1
  port: 8077
  error:
    include-message: never

spring:
  thymeleaf:
    cache: false

  datasource:
    url: "jdbc:h2:file:./data/cawl;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

shop:
  # URL publique du site : sert à construire l'URL de retour après paiement.
  base-url: ${SHOP_BASE_URL:http://localhost:8077}
  # Frais appliqués uniquement si le client choisit la livraison.
  shipping-fee: ${SHOP_SHIPPING_FEE:6.90}

cawl:
  pspid: ${CAWL_PSPID:lmdp}
  api-key: ${CAWL_API_KEY:}
  api-secret: ${CAWL_API_SECRET:}
  webhook-key: ${CAWL_WEBHOOK_KEY:}
  webhook-secret: ${CAWL_WEBHOOK_SECRET:}
  # Préproduction par défaut ; en production : https://payment.cawl-solutions.fr/
  api-endpoint: ${CAWL_API_ENDPOINT:https://payment.preprod.cawl-solutions.fr}
  integrator: ${CAWL_INTEGRATOR:lmdp}

  # Compte administrateur du back-office (/admin), créé automatiquement au premier
  # démarrage si la table admin_users est vide. Si le mot de passe n'est pas fourni,
  # un mot de passe aléatoire est généré et affiché une seule fois dans les logs.
  admin:
    username: ${CAWL_ADMIN_USERNAME:admin}
    password: ${CAWL_ADMIN_PASSWORD:}
