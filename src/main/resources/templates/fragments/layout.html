<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head><title>Fragments</title></head>
<body>

<a href="#contenu" class="skip-link" th:fragment="skip-link">Aller au contenu</a>

<!-- En-tête commun : logo principal + navigation -->
<header th:fragment="header(activePage)" class="site-header">
    <div class="container header-inner">
        <a href="/" class="brand-link" aria-label="Les Merveilles de Philomène — retour à l'accueil">
            <img src="/images/logo_principal.png"
                 alt="Les Merveilles de Philomène"
                 class="brand-logo">
        </a>

        <div class="header-actions">
            <button type="button" id="nav-toggle" class="nav-toggle"
                    aria-expanded="false" aria-controls="main-nav">
                <span class="nav-toggle-bar" aria-hidden="true"></span>
                <span class="nav-toggle-bar" aria-hidden="true"></span>
                <span class="nav-toggle-bar" aria-hidden="true"></span>
                <span class="visually-hidden">Ouvrir le menu</span>
            </button>

            <nav id="main-nav" class="main-nav" aria-label="Navigation principale">
                <ul class="nav-list">
                    <li>
                        <a href="/"
                           th:classappend="${activePage == 'accueil'} ? ' is-active'"
                           th:attr="aria-current=${activePage == 'accueil'} ? 'page' : null">Accueil</a>
                    </li>
                    <li>
                        <a href="/creations"
                           th:classappend="${activePage == 'creations'} ? ' is-active'"
                           th:attr="aria-current=${activePage == 'creations'} ? 'page' : null">Créations</a>
                    </li>
                    <li>
                        <a href="/atelier"
                           th:classappend="${activePage == 'atelier'} ? ' is-active'"
                           th:attr="aria-current=${activePage == 'atelier'} ? 'page' : null">L'atelier</a>
                    </li>
                </ul>
            </nav>

            <a href="/panier" class="cart-link"
               th:classappend="${activePage == 'panier'} ? ' is-active'"
               th:attr="aria-current=${activePage == 'panier'} ? 'page' : null">
                <svg class="cart-icon" viewBox="0 0 24 24" width="22" height="22" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-label">Panier</span>
                <span class="cart-badge" id="cart-badge" hidden>0</span>
            </a>
        </div>
    </div>
</header>

<!-- Pied de page commun -->
<footer th:fragment="footer" class="site-footer">
    <div class="container footer-inner">
        <div class="footer-brand">
            <img src="/images/logo_secondaire.png"
                 alt="Monogramme Les Merveilles de Philomène"
                 class="footer-monogram">
            <p class="footer-brand-name">Les Merveilles de Philomène</p>
        </div>

        <nav class="footer-nav" aria-label="Navigation du pied de page">
            <ul>
                <li><a href="/">Accueil</a></li>
                <li><a href="/creations">Créations</a></li>
                <li><a href="/atelier">L'atelier</a></li>
                <li><a href="/panier">Panier</a></li>
            </ul>
        </nav>

        <p class="footer-copyright">
            &copy; <span th:text="${currentYear}">2026</span> Les Merveilles de Philomène
        </p>
    </div>
</footer>

</body>
</html>
