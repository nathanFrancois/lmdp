<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Votre demande de devis</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f1ec; font-family:Georgia, 'Times New Roman', serif; color:#3a2e28;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f1ec; padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; overflow:hidden; max-width:600px; width:100%;">
                <tr>
                    <td style="background-color:#a9765b; padding:24px 32px; text-align:center;">
                        <span style="color:#ffffff; font-size:22px; letter-spacing:1px;">Les Merveilles de Philomène</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <h1 style="font-size:20px; margin:0 0 16px;">Merci pour votre demande, <span th:text="${customerName}">Prénom</span> !</h1>
                        <p style="font-size:15px; line-height:1.6; margin:0 0 16px;">
                            Votre demande de devis pour la personnalisation de
                            <strong th:text="${product.name}">Nom de l'objet</strong> a bien été reçue.
                            Nous revenons vers vous rapidement pour finaliser votre projet.
                        </p>
                        <p style="font-size:13px; color:#6b5d54; margin-top:32px;">
                            Une question en attendant ? Répondez simplement à cet e-mail.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
