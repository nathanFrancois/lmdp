<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvelle demande de devis</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f1ec; font-family:Georgia, 'Times New Roman', serif; color:#3a2e28;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f1ec; padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; overflow:hidden; max-width:600px; width:100%;">
                <tr>
                    <td style="background-color:#a9765b; padding:24px 32px; text-align:center;">
                        <span style="color:#ffffff; font-size:22px; letter-spacing:1px;">Les Merveilles de Philomène</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <h1 style="font-size:20px; margin:0 0 16px;">
                            Nouvelle demande de devis — <span th:text="${projectLabel}">Votre objet</span>
                        </h1>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse; font-size:14px; margin-bottom:16px;">
                            <tr>
                                <td style="padding:6px 0; font-weight:bold; width:160px;">Nom</td>
                                <td style="padding:6px 0;" th:text="${customerName}">Nom du client</td>
                            </tr>
                            <tr>
                                <td style="padding:6px 0; font-weight:bold;">E-mail</td>
                                <td style="padding:6px 0;" th:text="${customerEmail}">client@exemple.fr</td>
                            </tr>
                            <tr>
                                <td style="padding:6px 0; font-weight:bold;">Téléphone</td>
                                <td style="padding:6px 0;" th:text="${customerPhone}">Non renseigné</td>
                            </tr>
                            <tr th:each="entry : ${details}">
                                <td style="padding:6px 0; font-weight:bold;" th:text="${entry.key}">Libellé</td>
                                <td style="padding:6px 0;" th:text="${entry.value}">Valeur</td>
                            </tr>
                        </table>

                        <p style="font-size:14px; font-weight:bold; margin:16px 0 4px;">Le projet :</p>
                        <p style="font-size:15px; line-height:1.6; margin:0; white-space:pre-line;" th:text="${message}">
                            Description du projet.
                        </p>

                        <p style="font-size:13px; color:#6b5d54; margin-top:32px;">
                            Répondez directement à cet e-mail pour recontacter le client à l'adresse ci-dessus.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
